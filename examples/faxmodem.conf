# faxmodem configuration. Every key is the long form of a command line flag
# with the leading dashes removed; pass it with --config /etc/faxmodem.conf.
#
# Precedence: command line flags > FAXMODEM_* environment > this file > defaults.

# --- SIP account -----------------------------------------------------------
server        = sip.example.com
username      = 1001
auth-user     = 1001
# Leave the password out of the file and set FAXMODEM_PASSWORD instead.
# password    = secret
reg-expires   = 300

# Registration defaults to off for `send` (the INVITE carries the digest
# response instead) and on for `receive` and `daemon --serve-inbound`. Set it
# explicitly only to override that:
# register    = true      # PBX that refuses calls from unregistered accounts
# register    = false     # inbound fed by a static route or IP trust
# proxy       = sip:edge.example.com;lr

# --- Transport -------------------------------------------------------------
transport     = udp
local-port    = 5060
# Media never strays outside [rtp-port, rtp-port + rtp-port-range]. Open exactly
# this range on the firewall and the SBC; a narrower allowance shows up as calls
# that connect and then hear nothing.
rtp-port        = 4000
rtp-port-range  = 100
# public-addr = 203.0.113.10      # when NAT sits between us and the trunk
# stun        = stun.example.com

# --- Media -----------------------------------------------------------------
codec             = pcmu
jitter-buffer-ms  = 150

# --- Fax -------------------------------------------------------------------
station-id    = +15550001111
header        = Sent by faxmodem
ecm           = true
max-speed     = 14400
# Setting timeout here pins it for BOTH directions: sending will no longer scale
# the deadline to the page count, and receiving loses its 8-hour backstop. Leave
# it out unless you mean that.
# timeout          = 1800
seconds-per-page = 90
# Watchdogs, so a dead call gives the channel back instead of holding it until
# the overall timeout while the sender redials into a busy signal.
media-timeout    = 20
progress-timeout = 180
advance-timeout  = 300

# Page length is advertised as A4+B4 (364mm), which covers US Legal. Enabling
# unlimited length lets a stuck sender feed rows forever - only turn it on if a
# real correspondent needs pages longer than 14 inches.
# unlimited-page-length = true

# --- Spool daemon ----------------------------------------------------------
spool-dir     = /var/spool/faxmodem
output-dir    = /var/lib/faxmodem/received
poll-interval = 2
max-attempts  = 3
retry-backoff = 60
serve-inbound = true

# --- Logging ---------------------------------------------------------------
log-level     = info
log-json      = false
